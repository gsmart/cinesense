services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cinesense}
      POSTGRES_USER: ${POSTGRES_USER:-cinesense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinesense}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cinesense} -d ${POSTGRES_DB:-cinesense}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cinesense:cinesense@db:5432/cinesense}
      TMDB_API_READ_ACCESS_TOKEN: ${TMDB_API_READ_ACCESS_TOKEN:-}
      CINESENSE_LLM_ENABLED: ${CINESENSE_LLM_ENABLED:-false}
      CINESENSE_LLM_BASE_URL: ${CINESENSE_LLM_BASE_URL:-}
      CINESENSE_LLM_API_KEY: ${CINESENSE_LLM_API_KEY:-}
      CINESENSE_LLM_MODEL: ${CINESENSE_LLM_MODEL:-}
      CINESENSE_LLM_TIMEOUT_SECONDS: ${CINESENSE_LLM_TIMEOUT_SECONDS:-10}
      CINESENSE_ENABLE_SHADOW_DIAGNOSTICS: ${CINESENSE_ENABLE_SHADOW_DIAGNOSTICS:-false}
      CINESENSE_SHADOW_ARTIFACT_ROOT: ${CINESENSE_SHADOW_ARTIFACT_ROOT:-/app/.local-artifacts/regional-shadow}
      CINESENSE_SHADOW_RUN_ID: ${CINESENSE_SHADOW_RUN_ID:-20260719T194508Z}
      CINESENSE_ACTIVE_RANKING_VERSION: ${CINESENSE_ACTIVE_RANKING_VERSION:-cine-score-v1}
      CINESENSE_SHADOW_RANKING_VERSION: ${CINESENSE_SHADOW_RANKING_VERSION:-disabled}
    ports:
      - "8000:8000"
    volumes:
      - ./.local-artifacts/regional-shadow:/app/.local-artifacts/regional-shadow:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_CINESENSE_ENABLE_SHADOW_DIAGNOSTICS: ${NEXT_PUBLIC_CINESENSE_ENABLE_SHADOW_DIAGNOSTICS:-false}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_CINESENSE_ENABLE_SHADOW_DIAGNOSTICS: ${NEXT_PUBLIC_CINESENSE_ENABLE_SHADOW_DIAGNOSTICS:-false}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
